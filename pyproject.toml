[project]
name = "data-agent-yt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yogendra Adiyarapu", email = "yogendraadiyarapu8260@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "ipython>=9.17.1",
    "langchain>=1.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "openai>=3.8.0",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.13",
    "pydant>=1.1.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
data-agent-yt = "data_agent_yt:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
